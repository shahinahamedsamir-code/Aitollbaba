# Hostinger deploys a branch straight into public_html, but `main` holds the
# source and this project is a static export — the site is what `next build`
# writes into out/. So: build here on every push to main, and publish the
# CONTENTS of out/ to a `deploy` branch. Point Hostinger at `deploy`.
#
# No secrets are needed; GITHUB_TOKEN is issued to the run automatically.

name: Build and publish the static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # A static export with no index.html is the failure this whole workflow
      # exists to prevent, so fail loudly rather than publish a broken tree.
      - name: Check the export looks like a site
        run: |
          test -f out/index.html || { echo "out/index.html missing — build did not export"; exit 1; }
          test -f out/.htaccess || { echo "out/.htaccess missing — public/ was not copied"; exit 1; }
          echo "exported $(find out -name '*.html' | wc -l) pages"

      # out/ is a fresh repo of its own, so the parent .gitignore (which
      # ignores out/) does not apply to what is committed here.
      - name: Publish out/ to the deploy branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd out
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "published $(git ls-files | wc -l) files to the deploy branch"
